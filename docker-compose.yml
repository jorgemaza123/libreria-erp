version: '3.8'

services:
  app:
    build: .
    image: sistema-libreria:v1
    container_name: sistema_app
    ports:
      - "8443:8443" # PUERTO HTTPS SEGURO
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/libreria_db}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-1234}
      - SERVER_PORT=${SERVER_PORT:-8443}
      - SERVER_SSL_ENABLED=${SERVER_SSL_ENABLED:-true}
      - AUTO_UPDATE_ENABLED=${AUTO_UPDATE_ENABLED:-true}

      # Para override manual de IP (descomentar y poner la IP del host si la detección automática falla):
      # - HOST_IP=192.168.1.100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persistir el certificado para que no pida confirmación cada vez que se reinicia
      - ./datos_seguridad:/app/datos_seguridad
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./backups_cliente:/backups
      - ./scripts:/scripts

    restart: always

  db:
    image: postgres:15
    container_name: sistema_db
    environment:
      POSTGRES_DB: libreria_db
      POSTGRES_PASSWORD: 1234
      POSTGRES_USER: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./backups_cliente:/backups
      - ./scripts:/scripts
    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cron para Backups Automáticos (Comprimidos)
  backup-cron:
    image: postgres:15
    container_name: sistema_backup
    volumes:
      - ./backups_cliente:/backups
      - ./scripts:/scripts
    environment:
      PGPASSWORD: 1234
    command: >
      bash -c "chmod +x /scripts/backup.sh && 
      while true; do 
        sleep 86400; # Respaldo cada 24 horas
        /scripts/backup.sh; 
      done"
    depends_on:
      - db

