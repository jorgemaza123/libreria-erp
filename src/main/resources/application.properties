# Nombre de la App
spring.application.name=SistemaLibreria

# Base de Datos PostgreSQL
# Usar variables de entorno en producción: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/libreria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuración
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# =============================================
# CONFIGURACIÓN SSL/HTTPS
# =============================================
# Puerto HTTPS (cambiar de 8083 a 8443 para SSL)
server.port=8443
# Escuchar en todas las interfaces (necesario para acceso LAN/móvil)
server.address=0.0.0.0

# Habilitar SSL
server.ssl.enabled=true

# Keystore (se genera automáticamente si no existe)
server.ssl.key-store=keystore.p12
server.ssl.key-store-password=sistemaerp
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=sistemaerp

# =============================================
# SUBIDA DE ARCHIVOS
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directorio de uploads
app.upload-dir=uploads

# =============================================
# SESIÓN
# =============================================
# Sesión (2 horas para seguridad)
server.servlet.session.timeout=7200s