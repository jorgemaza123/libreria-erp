# Nombre de la App
spring.application.name=SistemaLibreria
app.timezone=America/Lima
spring.jackson.time-zone=${app.timezone}

# Base de Datos PostgreSQL
# Usar variables de entorno en producción: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/libreria_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# MEDIO-1 FIX: Pool de conexiones HikariCP explícito
# Evita timeouts con 10+ usuarios simultáneos
# =============================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=LibreriaHikariPool

# JPA / Hibernate Configuración
# BAJO-3: En producción migrar a Flyway/Liquibase para control preciso de migraciones
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf
# BAJO-6: cache=false para desarrollo. En producción usar perfil -prod con cache=true
spring.thymeleaf.cache=false

# =============================================
# CONFIGURACIÓN SSL/HTTPS
# =============================================
# Puerto HTTPS (cambiar de 8083 a 8443 para SSL)
server.port=8443
# Escuchar en todas las interfaces (necesario para acceso LAN/móvil)
server.address=0.0.0.0

# Habilitar SSL
server.ssl.enabled=true

# Keystore (se genera automáticamente si no existe)
server.ssl.key-store=keystore.p12
# ALTO-5 FIX: Contraseña SSL ahora en variable de entorno (no hardcoded)
server.ssl.key-store-password=${SSL_KS_PASSWORD:sistemaerp}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=sistemaerp

# =============================================
# SUBIDA DE ARCHIVOS
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Directorio de uploads
app.upload-dir=uploads

# =============================================
# SESIÓN
# =============================================
# Sesión (2 horas para seguridad)
server.servlet.session.timeout=7200s

# =============================================
# BÚSQUEDA AVANZADA (FTS + pg_trgm)
# =============================================
# FTS está integrado en ProductoBusquedaService con fallback automático a ILIKE.
# No requiere cambiar flags en producción — el fallback es transparente en código.
# Estas propiedades son de referencia para futuros ajustes:
busqueda.avanzada.enabled=true
busqueda.avanzada.pos.enabled=true

# =============================================
# ACTUATOR (health check para reconexión)
# =============================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
