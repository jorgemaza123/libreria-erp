<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin Conexión - Sistema ERP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 30px;
            max-width: 440px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        p {
            font-size: 1.05rem;
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-retry {
            display: inline-block;
            padding: 14px 40px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-retry:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.6);
        }
        .hint {
            margin-top: 30px;
            font-size: 0.85rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#128268;</div>
        <h1>Sin conexión</h1>
        <p>
            No se puede conectar al servidor.<br>
            Verifique que la computadora con el sistema esté encendida
            y que su dispositivo esté conectado al mismo WiFi.
        </p>
        <a href="/" class="btn-retry" onclick="window.location.reload(); return false;">
            Reintentar
        </a>
        <div class="hint">
            Si el problema persiste, contacte al administrador del sistema.
        </div>
    </div>
</body>
</html>
