<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}"
      th:with="active=${ordenEdicion != null ? 'servicios' : 'nuevo_servicio'}">
<head>
    <title>Nueva Orden de Servicio</title>
</head>
<body>

<div layout:fragment="content">
    <section class="content-header">
        <div class="container-fluid"><h1>Nueva Orden de Servicio / Proyecto</h1></div>
    </section>

    <section class="content">
        <div class="container-fluid">
            <input type="hidden" id="ordenId" th:value="${ordenEdicion != null ? ordenEdicion.id : ''}">
            <div class="card card-navy card-outline">
                <div class="card-header">
                    <h3 class="card-title">Datos del Proyecto</h3>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <label>Tipo Servicio</label>
                            <input type="text" id="tipoServicio" class="form-control" list="listaServicios" placeholder="Ej: ESTAMPADOS">
                            <datalist id="listaServicios">
                                <option th:each="tipo : ${tipos}" th:value="${tipo}"></option>
                            </datalist>
                        </div>
                        <div class="col-md-6">
                            <label>Titulo del Trabajo</label>
                            <input type="text" id="tituloTrabajo" class="form-control" placeholder="Ej: Estampados de 11 polos rojo y azul">
                        </div>
                        <div class="col-md-3">
                            <label>Entrega Estimada</label>
                            <input type="date" id="fechaEntrega" class="form-control">
                        </div>
                    </div>

                    <div class="row mt-3 bg-light p-2 rounded">
                        <div class="col-md-4">
                            <label>Cliente</label>
                            <input type="text" id="clienteNombre" class="form-control" placeholder="Nombre completo">
                        </div>
                        <div class="col-md-2">
                            <label>DNI / RUC</label>
                            <input type="text" id="clienteDoc" class="form-control" placeholder="Documento">
                        </div>
                        <div class="col-md-3">
                            <label>Telefono</label>
                            <input type="text" id="clienteTel" class="form-control" placeholder="WhatsApp o llamada">
                        </div>
                        <div class="col-md-3">
                            <label>Email del cliente</label>
                            <input type="email" id="clienteEmail" class="form-control" placeholder="correo@cliente.com">
                        </div>
                    </div>

                    <div class="row mt-2">
                        <div class="col-md-12">
                            <label>Direccion del cliente</label>
                            <input type="text" id="clienteDireccion" class="form-control" placeholder="Direccion o referencia">
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col-12">
                            <label>Desglose de Costos (Materiales, mano de obra, adicionales, etc.)</label>
                            <table class="table table-bordered table-sm">
                                <thead class="bg-navy">
                                <tr>
                                    <th>Descripcion de la tarea / item</th>
                                    <th width="150">Costo (S/)</th>
                                    <th width="50"></th>
                                </tr>
                                </thead>
                                <tbody id="tbodyItems"></tbody>
                                <tfoot>
                                <tr>
                                    <td colspan="3">
                                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="agregarFila()">
                                            <i class="fas fa-plus"></i> Agregar Tarea/Item
                                        </button>
                                    </td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    <div class="row justify-content-end mt-3">
                        <div class="col-md-4">
                            <table class="table table-borderless">
                                <tr>
                                    <th class="text-right">TOTAL PRESUPUESTO:</th>
                                    <td><input type="number" id="total" class="form-control text-right font-weight-bold" readonly value="0.00"></td>
                                </tr>
                                <tr>
                                    <th class="text-right text-success">ADELANTO RECIBIDO:</th>
                                    <td><input type="number" id="aCuenta" class="form-control text-right border-success" value="0.00" oninput="calcularTotales()"></td>
                                </tr>
                                <tr>
                                    <th class="text-right text-danger">SALDO PENDIENTE:</th>
                                    <td class="text-right"><h3 class="text-danger m-0" id="saldo">S/ 0.00</h3></td>
                                </tr>
                            </table>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Observaciones Internas</label>
                        <textarea id="observaciones" class="form-control" rows="3" placeholder="Notas tecnicas, alcances o acuerdos comerciales..."></textarea>
                    </div>
                </div>

                <div class="card-footer text-right">
                    <button type="button" class="btn btn-app bg-success" onclick="guardarOrden()">
                        <i class="fas fa-file-signature"></i> Guardar y PDF
                    </button>
                </div>
            </div>
        </div>
    </section>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        const ordenEdit = /*[[${ordenEdicion}]]*/ null;

        $(document).ready(function() {
            if (ordenEdit) {
                cargarEdicion();
            } else {
                agregarFila();
            }
        });

        function agregarFila(descripcion = '', costo = '0.00') {
            let html = `
                <tr>
                    <td><input type="text" class="form-control item-desc" value="${escapeHtml(descripcion)}" placeholder="Ej: Mano de obra, materiales, estampado..."></td>
                    <td><input type="number" class="form-control item-costo" value="${costo}" step="0.50" oninput="calcularTotales()"></td>
                    <td class="text-center">
                        <button type="button" class="btn btn-danger btn-sm" onclick="$(this).closest('tr').remove(); calcularTotales();">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>`;
            $('#tbodyItems').append(html);
        }

        function calcularTotales() {
            let total = 0;
            $('.item-costo').each(function() { total += parseFloat($(this).val()) || 0; });

            let aCuenta = parseFloat($('#aCuenta').val()) || 0;
            if (aCuenta > total) {
                $('#aCuenta').addClass('is-invalid');
            } else {
                $('#aCuenta').removeClass('is-invalid');
            }

            let saldo = Math.max(total - aCuenta, 0);
            $('#total').val(total.toFixed(2));
            $('#saldo').text('S/ ' + saldo.toFixed(2));
        }

        function guardarOrden() {
            let items = [];
            $('#tbodyItems tr').each(function() {
                let desc = ($(this).find('.item-desc').val() || '').trim();
                let costo = parseFloat($(this).find('.item-costo').val()) || 0;
                if (desc !== '') items.push({ descripcion: desc, costo: costo });
            });

            if (items.length === 0) {
                return Swal.fire('Error', 'Debe agregar al menos una tarea o costo', 'warning');
            }

            let dto = {
                id: ordenEdit ? ordenEdit.id : null,
                tipoServicio: $('#tipoServicio').val(),
                tituloTrabajo: $('#tituloTrabajo').val(),
                fechaEntrega: $('#fechaEntrega').val() || null,
                clienteNombre: $('#clienteNombre').val(),
                clienteDocumento: $('#clienteDoc').val(),
                clienteTelefono: $('#clienteTel').val(),
                clienteEmail: $('#clienteEmail').val(),
                clienteDireccion: $('#clienteDireccion').val(),
                aCuenta: parseFloat($('#aCuenta').val()) || 0,
                observaciones: $('#observaciones').val(),
                items: items
            };

            $.ajax({
                url: '/ordenes/api/guardar',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(dto),
                success: function(resp) {
                    const titulo = dto.id ? 'Actualizado' : 'Registrado';
                    const texto = dto.id ? `Orden #${resp.id} actualizada.` : `Orden #${resp.id} creada.`;
                    Swal.fire(titulo, texto, 'success').then(() => {
                        window.open('/ordenes/pdf/' + resp.id, '_blank');
                        window.location.href = '/ordenes/lista';
                    });
                },
                error: function(err) {
                    let mensaje = (err.responseText || 'No se pudo guardar la orden').toString();
                    Swal.fire('Error', mensaje, 'error');
                }
            });
        }

        function cargarEdicion() {
            $('#tbodyItems').empty();
            $('#tipoServicio').val(ordenEdit.tipoServicio || '');
            $('#tituloTrabajo').val(ordenEdit.tituloTrabajo || '');
            $('#fechaEntrega').val(ordenEdit.fechaEntregaEstimada || '');
            $('#clienteNombre').val(ordenEdit.clienteNombre || '');
            $('#clienteDoc').val(ordenEdit.clienteDocumento || '');
            $('#clienteTel').val(ordenEdit.clienteTelefono || '');
            $('#clienteEmail').val(ordenEdit.clienteEmail || '');
            $('#clienteDireccion').val(ordenEdit.clienteDireccion || '');
            $('#aCuenta').val(ordenEdit.aCuenta != null ? ordenEdit.aCuenta : 0);
            $('#observaciones').val(ordenEdit.observaciones || '');

            if (ordenEdit.items && ordenEdit.items.length) {
                ordenEdit.items.forEach(item => agregarFila(item.descripcion || '', item.costo || '0.00'));
            } else {
                agregarFila();
            }
            calcularTotales();
        }

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</th:block>

</body>
</html>
