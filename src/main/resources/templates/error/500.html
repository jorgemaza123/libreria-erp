<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del Servidor - 500</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .error-page {
            text-align: center;
            color: white;
            padding: 40px 20px;
            max-width: 500px;
        }
        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        .error-code {
            font-size: 100px;
            font-weight: bold;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
            margin-bottom: 10px;
            line-height: 1;
        }
        .error-message {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .error-description {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-home {
            background: white;
            color: #e74c3c;
        }
        .btn-home:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            color: #c0392b;
            text-decoration: none;
        }
        .btn-back {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.05);
            text-decoration: none;
            color: white;
        }
        .help-text {
            margin-top: 40px;
            font-size: 14px;
            opacity: 0.8;
        }
        .error-details {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
            font-size: 13px;
            text-align: left;
        }
        .error-details summary {
            cursor: pointer;
            font-weight: bold;
        }
        .error-details pre {
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 class="error-code">500</h1>
        <h2 class="error-message">Error Interno del Servidor</h2>
        <p class="error-description">
            Ha ocurrido un error inesperado.<br>
            Nuestro equipo ha sido notificado. Por favor, intente nuevamente en unos momentos.
        </p>

        <div class="btn-container">
            <a href="/" class="btn btn-home">
                <i class="fas fa-home"></i> Ir al Inicio
            </a>
            <a href="javascript:history.back()" class="btn btn-back">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>

        <p class="help-text">
            <i class="fas fa-info-circle"></i>
            Si el problema persiste, contacte al administrador del sistema.
        </p>

        <!-- Detalles del error (solo visible si hay mensaje) -->
        <div th:if="${error != null or message != null}" class="error-details">
            <details>
                <summary><i class="fas fa-bug"></i> Detalles tecnicos</summary>
                <pre th:if="${timestamp}" th:text="'Fecha: ' + ${timestamp}"></pre>
                <pre th:if="${status}" th:text="'Estado: ' + ${status}"></pre>
                <pre th:if="${error}" th:text="'Error: ' + ${error}"></pre>
                <pre th:if="${message}" th:text="'Mensaje: ' + ${message}"></pre>
                <pre th:if="${path}" th:text="'Ruta: ' + ${path}"></pre>
            </details>
        </div>
    </div>
</body>
</html>
