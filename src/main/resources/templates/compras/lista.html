<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}"
      th:with="active='compras'">
<head>
    <title>Historial de Compras</title>
</head>
<body>

<div layout:fragment="content">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6"><h1>Historial de Compras</h1></div>
                <div class="col-sm-6 text-right">
                    <a th:href="@{/compras/nueva}" class="btn btn-navy"><i class="fas fa-plus"></i> Registrar Compra</a>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="container-fluid">
            <div class="card">
                <div class="card-body">
                    <table id="tablaCompras" class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Proveedor</th>
                                <th>Documento</th>
                                <th>Total</th>
                                <th>Obs</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${compras}">
                                <td th:text="${c.fecha != null ? #temporals.format(c.fecha, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                                <td th:text="${c.proveedor != null ? c.proveedor.razonSocial : 'PROVEEDOR ELIMINADO'}"></td>
                                <td th:text="${c.tipoComprobante} + ' ' + ${c.numeroComprobante}"></td>
                                <td class="font-weight-bold" th:text="'S/ ' + ${#numbers.formatDecimal(c.total, 1, 'COMMA', 2, 'POINT')}"></td>
                                <td th:text="${c.observaciones}"></td>
                                <td>
                                    <button class="btn btn-info btn-sm"
                                            th:onclick="verDetalle([[${c.id}]])"
                                            title="Ver Detalles">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal Detalle -->
    <div class="modal fade" id="modalDetalle" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header bg-navy">
                    <h5 class="modal-title">Detalle de Compra</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>Proveedor:</strong> <span id="lblProveedor"></span>
                        </div>
                        <div class="col-md-6 text-right">
                            <strong>Documento:</strong> <span id="lblDocumento"></span>
                        </div>
                    </div>

                    <table class="table table-sm table-bordered">
                        <thead class="bg-light">
                            <tr>
                                <th>Producto</th>
                                <th class="text-center">Cant.</th>
                                <th class="text-right">Costo U.</th>
                                <th class="text-right">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyDetalle"></tbody>
                        <tfoot>
                            <tr>
                                <th colspan="3" class="text-right">TOTAL:</th>
                                <th class="text-right" id="lblTotal"></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:inline="none">
        $(document).ready(function () {
            $("#tablaCompras").DataTable({
                "responsive": true,
                "autoWidth": false,
                "order": [[0, "desc"]],
                "language": { "url": "/js/datatables-es.json" }
            });
        });

        function verDetalle(id) {
            $("#tbodyDetalle").html('<tr><td colspan="4" class="text-center">Cargando...</td></tr>');
            $("#modalDetalle").modal("show");

            $.get("/compras/api/detalle/" + id, function(data) {
                $("#lblProveedor").text(data.proveedor);
                $("#lblDocumento").text(data.documento);
                $("#lblTotal").text('S/ ' + data.total.toFixed(2));

                let html = "";
                data.items.forEach(item => {
                    html += `<tr>
                        <td>${item.producto}</td>
                        <td class="text-center">${item.cantidad}</td>
                        <td class="text-right">S/ ${item.precio.toFixed(2)}</td>
                        <td class="text-right">S/ ${item.subtotal.toFixed(2)}</td>
                    </tr>`;
                });
                $("#tbodyDetalle").html(html);
            }).fail(function() {
                $("#tbodyDetalle").html('<tr><td colspan="4" class="text-danger text-center">Error al cargar datos</td></tr>');
            });
        }
    </script>
</th:block>

</body>
</html>
