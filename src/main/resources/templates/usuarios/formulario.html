<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}"
      th:with="active='usuarios'">
<head>
    <title th:text="${titulo}">Usuario</title>
</head>
<body>

<div layout:fragment="content">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6">
                    <h1 th:text="${titulo}">Usuario</h1>
                </div>
                <div class="col-sm-6">
                    <ol class="breadcrumb float-sm-right">
                        <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                        <li class="breadcrumb-item"><a th:href="@{/usuarios}">Usuarios</a></li>
                        <li class="breadcrumb-item active" th:text="${titulo}">Formulario</li>
                    </ol>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="container-fluid">
            <div class="card card-primary">
                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Nombre Completo *</label>
                                    <input type="text" class="form-control" th:field="*{nombreCompleto}" required placeholder="Ej: Juan Pérez">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Username (Login) *</label>
                                    <input type="text" class="form-control" th:field="*{username}" required placeholder="Ej: jperez" autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Contraseña</label>
                                    <input type="password" class="form-control" th:field="*{password}" placeholder="Dejar vacío para no cambiar" autocomplete="new-password">
                                    <small class="form-text text-muted" th:if="${usuario.id != null}">Solo llene si desea cambiar la clave actual.</small>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Estado</label>
                                    <select class="form-control" th:field="*{activo}">
                                        <option value="true">ACTIVO (Puede Ingresar)</option>
                                        <option value="false">INACTIVO (Acceso Bloqueado)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <hr>
                        <div class="form-group">
                            <label>Roles / Permisos</label>
                            <div class="row">
                                <div class="col-sm-4" th:each="rol : ${rolesDisponibles}">
                                    <div class="icheck-primary d-inline">
                                        <input type="checkbox" name="rolesIds" th:value="${rol.id}"
                                               th:id="${'rol-' + rol.id}"
                                               th:checked="${#lists.contains(usuario.roles, rol)}">
                                        <label th:for="${'rol-' + rol.id}" th:text="${rol.nombre}">Rol</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer text-right">
                        <a th:href="@{/usuarios}" class="btn btn-default">Cancelar</a>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar Usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

</body>
</html>
