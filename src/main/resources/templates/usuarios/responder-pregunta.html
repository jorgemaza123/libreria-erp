<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Identidad - Sistema Librería</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .verify-card {
            max-width: 500px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .verify-header {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 30px;
            text-align: center;
        }
        .verify-header i {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        .verify-body {
            padding: 30px;
            background: white;
            border-radius: 0 0 15px 15px;
        }
        .question-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
        }
        .btn-verificar {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
        }
        .btn-verificar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
            color: white;
        }
        .password-strength {
            height: 5px;
            border-radius: 3px;
            margin-top: 5px;
            transition: all 0.3s;
        }
        .strength-weak { background: #dc3545; width: 33%; }
        .strength-medium { background: #ffc107; width: 66%; }
        .strength-strong { background: #28a745; width: 100%; }
    </style>
</head>
<body>
    <div class="verify-card card">
        <div class="verify-header">
            <i class="fas fa-user-check"></i>
            <h3 class="mb-0">Verificar Identidad</h3>
            <p class="mb-0 mt-2 opacity-75">Responda su pregunta de seguridad</p>
        </div>

        <div class="verify-body">
            <!-- Mensajes -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="close" data-dismiss="alert">&times;</button>
            </div>

            <div class="question-box">
                <p class="mb-0">
                    <i class="fas fa-user text-success mr-2"></i>
                    <strong>Usuario:</strong> <span th:text="${username}" class="text-primary"></span>
                </p>
            </div>

            <form th:action="@{/usuarios/restablecer-password}" method="post" id="formRestablecer">
                <input type="hidden" name="username" th:value="${username}">

                <!-- Pregunta de Seguridad -->
                <div class="form-group">
                    <label class="font-weight-bold">
                        <i class="fas fa-question-circle text-info mr-1"></i> Pregunta de Seguridad
                    </label>
                    <div class="alert alert-info mb-0">
                        <span th:text="${preguntaSeguridad}"></span>
                    </div>
                </div>

                <!-- Respuesta -->
                <div class="form-group">
                    <label for="respuestaSeguridad">
                        <i class="fas fa-comment mr-1"></i> Su Respuesta
                    </label>
                    <input type="text" class="form-control form-control-lg" id="respuestaSeguridad"
                           name="respuestaSeguridad" required placeholder="Escriba su respuesta"
                           autocomplete="off">
                    <small class="text-muted">La respuesta no distingue mayúsculas/minúsculas</small>
                </div>

                <hr>

                <!-- Nueva Contraseña -->
                <div class="form-group">
                    <label for="nuevaPassword">
                        <i class="fas fa-lock mr-1"></i> Nueva Contraseña
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="nuevaPassword"
                               name="nuevaPassword" required minlength="8"
                               placeholder="Mínimo 8 caracteres">
                        <div class="input-group-append">
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('nuevaPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="form-group">
                    <label for="confirmarPassword">
                        <i class="fas fa-lock mr-1"></i> Confirmar Contraseña
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirmarPassword"
                               name="confirmarPassword" required minlength="8"
                               placeholder="Repita la contraseña">
                        <div class="input-group-append">
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmarPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <small id="matchFeedback" class="text-danger" style="display: none;">
                        <i class="fas fa-times"></i> Las contraseñas no coinciden
                    </small>
                </div>

                <button type="submit" class="btn btn-verificar btn-block btn-lg mt-4" id="btnSubmit" disabled>
                    <i class="fas fa-check-circle mr-2"></i> Restablecer Contraseña
                </button>
            </form>

            <hr>

            <div class="text-center">
                <a th:href="@{/usuarios/recuperar-password}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left mr-1"></i> Volver
                </a>
                <a th:href="@{/login}" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-sign-in-alt mr-1"></i> Ir al Login
                </a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Mostrar/ocultar contraseña
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.nextElementSibling.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Validar fortaleza
        function checkPasswordStrength(password) {
            const bar = document.getElementById('passwordStrength');

            if (password.length < 8) {
                bar.className = 'password-strength';
                return false;
            }

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            if (strength <= 1) {
                bar.className = 'password-strength strength-weak';
            } else if (strength <= 2) {
                bar.className = 'password-strength strength-medium';
            } else {
                bar.className = 'password-strength strength-strong';
            }

            return password.length >= 8;
        }

        // Validar coincidencia
        function checkMatch() {
            const pass1 = document.getElementById('nuevaPassword').value;
            const pass2 = document.getElementById('confirmarPassword').value;
            const feedback = document.getElementById('matchFeedback');

            if (pass2.length > 0 && pass1 !== pass2) {
                feedback.style.display = 'block';
                return false;
            } else {
                feedback.style.display = 'none';
                return pass1 === pass2 && pass1.length >= 8;
            }
        }

        // Validar formulario
        function validateForm() {
            const btn = document.getElementById('btnSubmit');
            const respuesta = document.getElementById('respuestaSeguridad').value;
            const isStrong = checkPasswordStrength(document.getElementById('nuevaPassword').value);
            const isMatch = checkMatch();

            btn.disabled = !(respuesta.length > 0 && isStrong && isMatch);
        }

        // Eventos
        document.getElementById('respuestaSeguridad').addEventListener('input', validateForm);
        document.getElementById('nuevaPassword').addEventListener('input', function() {
            checkPasswordStrength(this.value);
            validateForm();
        });
        document.getElementById('confirmarPassword').addEventListener('input', validateForm);
    </script>
</body>
</html>
