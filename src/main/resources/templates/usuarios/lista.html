<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}"
      th:with="active='usuarios'">
<head>
    <title>Gestión de Usuarios</title>
</head>
<body>

<div layout:fragment="content">
    <section class="content-header">
        <div class="container-fluid">
            <div class="row mb-2">
                <div class="col-sm-6"><h1>Gestión de Usuarios</h1></div>
                <div class="col-sm-6 text-right">
                    <a href="/usuarios/nuevo" class="btn btn-primary"><i class="fas fa-user-plus"></i> Nuevo Usuario</a>
                </div>
            </div>
        </div>
    </section>

    <section class="content">
        <div class="container-fluid">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <button type="button" class="close" data-dismiss="alert">&times;</button>
                <i class="fas fa-check-circle mr-2"></i><span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <button type="button" class="close" data-dismiss="alert">&times;</button>
                <i class="fas fa-exclamation-triangle mr-2"></i><span th:text="${error}"></span>
            </div>
            <div class="card card-outline card-primary">
                <div class="card-body table-responsive p-0">
                    <table class="table table-hover text-nowrap">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Usuario</th>
                                <th>Nombre Completo</th>
                                <th>Roles</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td th:text="${u.id}"></td>
                                <td class="font-weight-bold" th:text="${u.username}"></td>
                                <td th:text="${u.nombreCompleto}"></td>
                                <td>
                                    <span th:each="rol : ${u.roles}" class="badge badge-info mr-1" th:text="${rol.nombre}"></span>
                                </td>
                                <td>
                                    <span th:if="${u.activo}" class="badge badge-success">ACTIVO</span>
                                    <span th:unless="${u.activo}" class="badge badge-danger">INACTIVO</span>
                                </td>
                                <td>
                                    <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-warning btn-sm"><i class="fas fa-edit"></i></a>
                                    <a th:if="${u.username != 'admin'}"
                                       th:href="@{/usuarios/eliminar/{id}(id=${u.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('¿Desactivar este usuario?')"><i class="fas fa-ban"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</div>

</body>
</html>
