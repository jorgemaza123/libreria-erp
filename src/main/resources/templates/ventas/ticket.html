<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticket</title>
    <style>
        /* Formato para impresora térmica 80mm */
        @page { size: 80mm auto; margin: 0; }
        body { width: 78mm; margin: 0 auto; padding: 2mm; font-family: 'Courier New', monospace; font-size: 12px; color: #000; }
        
        .center { text-align: center; }
        .right { text-align: right; }
        .bold { font-weight: bold; }
        
        /* Logo pequeño para ticket */
        .logo-ticket { max-width: 60mm; max-height: 25mm; display: block; margin: 0 auto 5px auto; object-fit: contain; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th { border-bottom: 1px dashed #000; text-align: left; font-size: 11px; }
        td { font-size: 11px; vertical-align: top; padding-top: 2px; }
        
        .divider { border-top: 1px dashed #000; margin: 5px 0; }
        
        .no-print { margin-bottom: 10px; text-align: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body onload="window.print()">

    <div class="no-print">
        <button onclick="window.print()">🖨️ IMPRIMIR</button>
        <button onclick="window.close()">CERRAR</button>
    </div>

    <div class="center">
        <!-- Logo condicional según configuración -->
        <img th:if="${config.mostrarLogoEnTicket != false and config.logoBase64 != null}"
             th:src="'data:image/png;base64,' + ${config.logoBase64}"
             class="logo-ticket">

        <div class="bold" style="font-size: 14px;" th:text="${config.nombreEmpresa}">EMPRESA</div>
        <div th:text="'RUC: ' + ${config.ruc}">RUC</div>
        <!-- Usar dirección de ticket si está definida, sino usar la de empresa -->
        <div th:text="${config.direccionTicket != null and !config.direccionTicket.isEmpty()} ? ${config.direccionTicket} : ${config.direccion}">Dirección</div>
        <!-- Usar teléfono de ticket si está definido, sino usar el de empresa -->
        <div th:if="${config.telefonoTicket != null and !config.telefonoTicket.isEmpty()}"
             th:text="'Tel: ' + ${config.telefonoTicket}"></div>
        <div th:unless="${config.telefonoTicket != null and !config.telefonoTicket.isEmpty()}"
             th:if="${config.telefono != null}"
             th:text="'Tel: ' + ${config.telefono}"></div>
        <br>
        <div class="bold" th:text="${venta.tipoComprobante} + ' DE VENTA'">BOLETA</div>
        <div th:text="${venta.serie} + '-' + ${#numbers.formatInteger(venta.numero, 6)}">B001-000001</div>
        <div th:text="${#temporals.format(venta.fechaEmision, 'dd/MM/yyyy')}"></div>
    </div>

    <div class="divider"></div>
    <div>CLIENTE: <span th:text="${venta.clienteDenominacion}"></span></div>
    <div>DOC: <span th:text="${venta.clienteNumeroDocumento}"></span></div>
    <div class="divider"></div>

    <table>
        <thead>
            <tr>
                <th width="50%">DESC</th>
                <th width="15%" class="right">CNT</th>
                <th width="35%" class="right">IMPORTE</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${venta.items}"
                th:with="yaDevuelto=${item.producto != null and cantidadesDevueltas != null ? cantidadesDevueltas[item.producto.id] : null},
                         cantNeta=${yaDevuelto != null ? item.cantidad.subtract(yaDevuelto) : item.cantidad},
                         subtotalNeto=${cantNeta.multiply(item.precioUnitario)}"
                th:if="${yaDevuelto == null or cantNeta.signum() > 0}">
                <td th:text="${item.descripcion}">Producto</td>
                <td class="right" th:text="${cantNeta}">1</td>
                <td class="right" th:text="${#numbers.formatDecimal(subtotalNeto, 1, 'COMMA', 2, 'POINT')}">10.00</td>
            </tr>
        </tbody>
    </table>

    <div class="divider"></div>

    <div class="right">
        <div th:if="${totalDevuelto != null and totalDevuelto.signum() > 0}">
            TOTAL ORIGINAL: S/ <span th:text="${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}">0.00</span>
        </div>
        <div th:if="${totalDevuelto != null and totalDevuelto.signum() > 0}" style="color:#dc3545;">
            (-) DEVUELTO: S/ <span th:text="${#numbers.formatDecimal(totalDevuelto, 1, 'COMMA', 2, 'POINT')}">0.00</span>
        </div>
        <div class="bold" th:text="${(totalDevuelto != null and totalDevuelto.signum() > 0) ? 'TOTAL NETO: S/ ' + #numbers.formatDecimal(venta.total.subtract(totalDevuelto), 1, 'COMMA', 2, 'POINT') : 'TOTAL: S/ ' + #numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}">TOTAL: S/ 0.00</div>
    </div>

    <!-- Mostrar método de pago si está disponible -->
    <div th:if="${venta.metodoPago != null and venta.metodoPago != 'EFECTIVO'}" class="center" style="margin-top: 5px;">
        <small th:text="'Pago: ' + ${venta.metodoPago}"></small>
    </div>

    <!-- CUENTAS BANCARIAS (condicional) -->
    <div th:if="${(config.mostrarCuentasBancariasEnTicket == null or config.mostrarCuentasBancariasEnTicket == true) and config.cuentasBancarias != null and !config.cuentasBancarias.isEmpty()}" style="margin-top: 8px;">
        <div class="divider"></div>
        <div class="center bold" style="font-size: 10px;">CUENTAS BANCARIAS:</div>
        <div class="center" style="font-size: 9px; white-space: pre-line;" th:text="${config.cuentasBancarias}"></div>
    </div>

    <!-- REDES SOCIALES (condicional) -->
    <div th:if="${config.mostrarRedesSocialesEnTicket == true}" class="center" style="margin-top: 5px; font-size: 9px;">
        <span th:if="${config.facebook != null and !config.facebook.isEmpty()}" th:text="'FB: ' + ${config.facebook}"></span>
        <span th:if="${config.instagram != null and !config.instagram.isEmpty()}" th:text="' | IG: ' + ${config.instagram}"></span>
        <span th:if="${config.whatsapp != null and !config.whatsapp.isEmpty()}" th:text="' | WA: ' + ${config.whatsapp}"></span>
    </div>

    <!-- MENSAJE PROMOCIONAL -->
    <div th:if="${config.mensajePromoTicket != null and !config.mensajePromoTicket.isEmpty()}"
         class="center bold" style="margin-top: 5px; font-size: 10px; padding: 3px; border: 1px dashed #000;">
        <span th:text="${config.mensajePromoTicket}"></span>
    </div>

    <br>
    <div class="center" th:text="${config.mensajePieTicket != null and !config.mensajePieTicket.isEmpty() ? config.mensajePieTicket : 'Gracias por su compra. Vuelva pronto!'}">
        Gracias por su compra
    </div>

    <!-- USUARIO CAJERO -->
    <div th:if="${venta.usuario != null}" class="center" style="margin-top: 5px; font-size: 9px;">
        <span th:text="'Atendido por: ' + ${venta.usuario.nombreCompleto}"></span>
    </div>

</body>
</html>
