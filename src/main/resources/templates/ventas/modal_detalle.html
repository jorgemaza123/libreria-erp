<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="contenido">
        <div class="row invoice-info">
            <div class="col-sm-4 invoice-col">
                De:
                <address>
                    <strong th:text="${config != null ? config.nombreEmpresa : 'Empresa'}"></strong><br>
                    <span th:text="${config != null ? config.direccion : ''}"></span>
                </address>
            </div>
            <div class="col-sm-4 invoice-col">
                Cliente:
                <address>
                    <strong th:text="${venta.clienteDenominacion}"></strong><br>
                    <span th:text="${venta.clienteNumeroDocumento}"></span><br>
                    <span th:text="${venta.clienteDireccion}"></span>
                </address>
            </div>
            <div class="col-sm-4 invoice-col">
                <b><span th:text="${venta.tipoComprobante}"></span></b><br>
                <b th:text="${venta.serie} + '-' + ${venta.numero}"></b><br>
                Fecha: <span th:text="${venta.fechaEmision}"></span><br>
                Estado: <span th:text="${venta.estado}" class="badge badge-warning"></span>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12 table-responsive">
                <table class="table table-striped table-sm">
                    <thead>
                        <tr>
                            <th>Cant.</th>
                            <th>Producto</th>
                            <th class="text-right">P. Unit</th>
                            <th class="text-right">Subtotal</th>
                            <th th:if="${venta.estado != 'ANULADO' and venta.estado != 'DEVUELTO_TOTAL'}"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${venta.items}">
                            <td>
                                <span th:text="${item.cantidad}"></span>
                                <!-- El badge de devuelto se muestra solo cuando el total devuelto
                                     del producto es menor que el total vendido (devolucion parcial del conjunto).
                                     Se muestra el devuelto total del producto una sola vez por línea
                                     para que el usuario sepa que parte ya fue regresada. -->
                                <span th:if="${item.producto != null
                                              and cantidadesDevueltas != null
                                              and cantidadesDevueltas[item.producto.id] != null
                                              and cantidadesTotalPorProducto != null
                                              and cantidadesDevueltas[item.producto.id].compareTo(cantidadesTotalPorProducto[item.producto.id]) < 0}"
                                      class="badge badge-warning ml-1" style="font-size:0.7em;"
                                      th:text="'(-' + ${cantidadesDevueltas[item.producto.id]} + ' en total)'"></span>
                            </td>
                            <td th:text="${item.descripcion}"></td>
                            <td class="text-right" th:text="${#numbers.formatDecimal(item.precioUnitario, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td class="text-right" th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td th:if="${venta.estado != 'ANULADO' and venta.estado != 'DEVUELTO_TOTAL'}">
                                <th:block th:if="${item.producto != null}"
                                          th:with="yaDevuelto=${cantidadesDevueltas != null ? cantidadesDevueltas[item.producto.id] : null},
                                                   totalVendidoProducto=${cantidadesTotalPorProducto != null ? cantidadesTotalPorProducto[item.producto.id] : item.cantidad},
                                                   todosDevueltos=${yaDevuelto != null and yaDevuelto.compareTo(totalVendidoProducto) >= 0}">
                                    <button th:if="${!todosDevueltos}"
                                            type="button" class="btn btn-warning btn-xs btn-devolver"
                                            th:data-venta-id="${venta.id}"
                                            th:data-producto-id="${item.producto.id}"
                                            th:data-descripcion="${item.descripcion}"
                                            th:data-cantidad="${item.cantidad}"
                                            th:data-precio="${item.precioUnitario}"
                                            title="Devolver este producto">
                                        <i class="fas fa-undo-alt"></i> Devolver
                                    </button>
                                    <span th:if="${todosDevueltos}"
                                          class="badge badge-secondary">Devuelto</span>
                                </th:block>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="row">
            <div class="col-6"></div>
            <div class="col-6">
                <div class="table-responsive">
                    <table class="table">
                        <tr>
                            <th style="width:50%">Op. Gravada:</th>
                            <td th:text="'S/ ' + ${#numbers.formatDecimal(venta.totalGravada, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                        <tr>
                            <th>I.G.V.:</th>
                            <td th:text="'S/ ' + ${#numbers.formatDecimal(venta.totalIgv, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                        <tr th:if="${totalDevuelto != null and totalDevuelto.signum() > 0}">
                            <th>Total Original:</th>
                            <td th:text="'S/ ' + ${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                        <tr th:if="${totalDevuelto != null and totalDevuelto.signum() > 0}" class="text-danger">
                            <th class="text-danger">(-) Devuelto:</th>
                            <td class="font-weight-bold" th:text="'S/ ' + ${#numbers.formatDecimal(totalDevuelto, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                        <tr th:if="${totalDevuelto != null and totalDevuelto.signum() > 0}" style="background-color:#fff3cd;">
                            <th>Total Neto:</th>
                            <td class="font-weight-bold" style="font-size: 1.2em;" th:text="'S/ ' + ${#numbers.formatDecimal(venta.total.subtract(totalDevuelto), 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                        <tr th:if="${totalDevuelto == null or totalDevuelto.signum() == 0}">
                            <th>Total:</th>
                            <td class="font-weight-bold" style="font-size: 1.2em;" th:text="'S/ ' + ${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}"></td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            function abrirImpresion() {
                var id = /*[[${venta.id}]]*/ 0;
                // Abre una ventana nueva limpia
                window.open('/ventas/imprimir/' + id, '_blank', 'width=900,height=700');
            }
        </script>
    </div>
</body>
</html>
