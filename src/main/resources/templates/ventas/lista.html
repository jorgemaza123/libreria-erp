<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{fragments/layout}"
      th:with="active='historial_ventas'">
<head>
    <title>Historial de Ventas</title>
</head>
<body>

<div layout:fragment="content">
    <section class="content-header">
        <div class="container-fluid"><h1>Historial de Ventas</h1></div>
    </section>

    <section class="content">
        <div class="container-fluid">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                <button type="button" class="close" data-dismiss="alert">&times;</button>
                <span th:text="${success}"></span>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <button type="button" class="close" data-dismiss="alert">&times;</button>
                <span th:text="${error}"></span>
            </div>

            <div class="card card-navy card-outline">
                <div class="card-header">
                    <h3 class="card-title">Listado General</h3>
                </div>
                <div class="card-body table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Comprobante</th>
                                <th>Cliente</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="v : ${ventas.content}">
                                <td th:text="${#temporals.format(v.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <span class="badge badge-info" th:text="${v.tipoComprobante}"></span>
                                    <strong th:text="${v.serie} + '-' + ${v.numero}"></strong>
                                </td>
                                <td th:text="${v.clienteDenominacion}"></td>
                                <td class="font-weight-bold">
                                    <th:block th:with="devuelto=${totalesDevueltos != null ? totalesDevueltos[v.id] : null}">
                                        <th:block th:if="${devuelto != null}">
                                            <del class="text-muted" style="font-size:0.85em;" th:text="'S/ ' + ${#numbers.formatDecimal(v.total, 1, 2)}"></del><br>
                                            <span class="text-danger" th:text="'S/ ' + ${#numbers.formatDecimal(v.total.subtract(devuelto), 1, 2)}"></span>
                                            <span class="badge badge-warning ml-1" th:text="'-S/ ' + ${#numbers.formatDecimal(devuelto, 1, 2)}"></span>
                                        </th:block>
                                        <th:block th:unless="${devuelto != null}">
                                            <span th:text="'S/ ' + ${#numbers.formatDecimal(v.total, 1, 'COMMA', 2, 'POINT')}"></span>
                                        </th:block>
                                    </th:block>
                                </td>
                                <td>
                                    <span th:if="${v.estado == 'EMITIDO'}" class="badge badge-success">EMITIDO</span>
                                    <span th:if="${v.estado == 'ANULADO'}" class="badge badge-danger">ANULADO</span>
                                    <span th:if="${v.estado == 'DEVUELTO_PARCIAL'}" class="badge badge-warning">DEV. PARCIAL</span>
                                    <span th:if="${v.estado == 'DEVUELTO_TOTAL'}" class="badge badge-secondary">DEVUELTO</span>
                                    <span th:if="${v.estado == 'PAGADO_TOTAL'}" class="badge badge-info">PAGADO</span>
                                </td>
                                <td class="text-right">
                                    <button class="btn btn-primary btn-sm btn-detalle" th:data-id="${v.id}" title="Ver Detalle">
                                        <i class="fas fa-eye"></i>
                                    </button>

                                    <button class="btn btn-success btn-sm"
                                            th:onclick="enviarWhatsappVenta([[${v.clienteDenominacion}]], [[${v.serie}]], [[${v.numero}]], [[${v.total}]], [[${v.clienteEntity != null ? v.clienteEntity.telefono : ''}]])"
                                            title="Enviar por WhatsApp">
                                        <i class="fab fa-whatsapp"></i>
                                    </button>

                                    <button class="btn btn-default btn-sm"
                                            th:onclick="abrirPdfVenta([[${v.id}]])"
                                            title="Imprimir Comprobante">
                                        <i class="fas fa-print"></i>
                                    </button>

                                    <button class="btn btn-info btn-sm"
                                            th:onclick="'abrirPdfFactura(' + ${v.id} + ')'"
                                            title="Ver PDF Comprobante">
                                        <i class="fas fa-file-pdf"></i>
                                    </button>

                                    <button th:if="${v.estado == 'EMITIDO'}"
                                            type="button" class="btn btn-danger btn-sm btn-anular"
                                            th:data-id="${v.id}"
                                            th:data-serie="${v.serie}"
                                            th:data-numero="${v.numero}"
                                            title="Anular">
                                        <i class="fas fa-ban"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="row mt-3" th:if="${ventas.totalPages > 0}">
                        <div class="col-md-12">
                            <nav>
                                <ul class="pagination justify-content-center">
                                    <li class="page-item" th:classappend="${ventas.first} ? 'disabled'">
                                        <a class="page-link" th:href="@{/ventas/lista(page=${currentPage - 1})}">Anterior</a>
                                    </li>
                                    <li class="page-item active">
                                        <span class="page-link" th:text="${currentPage + 1} + ' de ' + ${ventas.totalPages}"></span>
                                    </li>
                                    <li class="page-item" th:classappend="${ventas.last} ? 'disabled'">
                                        <a class="page-link" th:href="@{/ventas/lista(page=${currentPage + 1})}">Siguiente</a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <div class="modal fade" id="modalDetalle">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-navy">
                    <h4 class="modal-title">Detalle de Venta</h4>
                    <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body" id="modalBodyContent">
                    <div class="text-center py-5"><i class="fas fa-spinner fa-spin fa-2x"></i><p>Cargando...</p></div>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-default" data-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
    $(function () {
        // Lógica del modal detalle
        $(".btn-detalle").click(function(){
            var id = $(this).data("id");
            $("#modalBodyContent").load("/ventas/detalle/" + id);
            $("#modalDetalle").modal("show");
        });

        // U-1: reemplazar confirm() nativo con SweetAlert2 para anulación de venta
        $(document).on('click', '.btn-anular', function() {
            var id = $(this).data('id');
            var serie = $(this).data('serie');
            var numero = $(this).data('numero');
            Swal.fire({
                title: '¿Anular Venta?',
                html: 'Se anulará <strong>' + serie + '-' + numero + '</strong>.<br>Esta acción devolverá el stock.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, anular',
                cancelButtonText: 'Cancelar'
            }).then(function(result) {
                if (result.isConfirmed) {
                    var form = document.createElement('form');
                    form.method = 'POST';
                    form.action = '/ventas/anular/' + id;
                    document.body.appendChild(form);
                    form.submit();
                }
            });
        });
    });

    // --- HANDLER DEVOLUCIÓN DE PRODUCTO DESDE MODAL ---
    $(document).on('click', '.btn-devolver', function() {
        var btn = $(this);
        var ventaId    = btn.data('venta-id');
        var productoId = btn.data('producto-id');
        var descripcion  = btn.data('descripcion');
        var cantidadMax  = parseFloat(btn.data('cantidad'));
        var precio       = parseFloat(btn.data('precio'));

        Swal.fire({
            title: 'Devolución de Producto',
            icon: 'question',
            html: '<p class="text-left mb-2"><strong>' + descripcion + '</strong></p>' +
                  '<div class="form-group text-left mb-2">' +
                  '<label>Cantidad a devolver (máx: ' + cantidadMax + '):</label>' +
                  '<input type="number" id="dev-cant" class="form-control" min="0.01" max="' + cantidadMax + '" step="0.01" value="' + cantidadMax + '">' +
                  '</div>' +
                  '<div class="form-group text-left mb-2">' +
                  '<label>Motivo:</label>' +
                  '<select id="dev-motivo" class="form-control">' +
                  '<option value="DEFECTO_PRODUCTO">Defecto del producto</option>' +
                  '<option value="PRODUCTO_INCORRECTO">Producto incorrecto</option>' +
                  '<option value="CAMBIO_OPINION">Cambio de opinión del cliente</option>' +
                  '<option value="EXCESO_PEDIDO">Exceso en el pedido</option>' +
                  '<option value="OTRO">Otro</option>' +
                  '</select></div>' +
                  '<div class="form-group text-left">' +
                  '<label>Método de reembolso:</label>' +
                  '<select id="dev-metodo" class="form-control">' +
                  '<option value="EFECTIVO">Efectivo</option>' +
                  '<option value="TRANSFERENCIA">Transferencia</option>' +
                  '<option value="CREDITO_TIENDA">Crédito en tienda</option>' +
                  '</select></div>',
            showCancelButton: true,
            confirmButtonText: 'Procesar Devolución',
            confirmButtonColor: '#f39c12',
            cancelButtonText: 'Cancelar',
            focusConfirm: false,
            preConfirm: function() {
                var cant = parseFloat(document.getElementById('dev-cant').value);
                if (!cant || cant <= 0 || cant > cantidadMax) {
                    Swal.showValidationMessage('Cantidad inválida (máx: ' + cantidadMax + ')');
                    return false;
                }
                return {
                    cantidad: cant,
                    motivo: document.getElementById('dev-motivo').value,
                    metodo: document.getElementById('dev-metodo').value
                };
            }
        }).then(function(result) {
            if (result.isConfirmed) {
                var d = result.value;
                $.ajax({
                    url: '/devoluciones/api/procesar',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        ventaOriginalId: parseInt(ventaId),
                        motivoDevolucion: d.motivo,
                        metodoReembolso: d.metodo,
                        items: [{
                            productoId: parseInt(productoId),
                            cantidadDevuelta: d.cantidad,
                            precioUnitario: precio,
                            descripcion: descripcion
                        }]
                    }),
                    success: function(res) {
                        Swal.fire({
                            icon: 'success',
                            title: '¡Devolución procesada!',
                            html: 'Nota de crédito <strong>' + res.serie + '-' + String(res.numero).padStart(8, '0') + '</strong> generada.',
                            confirmButtonText: 'Aceptar'
                        }).then(function() { location.reload(); });
                    },
                    error: function(xhr) {
                        var msg = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error : 'Error al procesar la devolución';
                        Swal.fire('Error', msg, 'error');
                    }
                });
            }
        });
    });

    // --- FUNCIÓN IMPRIMIR HTML (ticket/impresión directa) ---
    function abrirPdfVenta(id) {
        window.open('/ventas/imprimir/' + id, '_blank', 'width=900,height=700');
    }

    // --- FUNCIÓN VER PDF COMPROBANTE (popup inline) ---
    function abrirPdfFactura(id) {
        var width = 900, height = 700;
        var left = Math.max(0, Math.round((screen.width - width) / 2));
        var top  = Math.max(0, Math.round((screen.height - height) / 2));
        window.open(
            '/ventas/pdf/' + id,
            'PdfComprobante_' + id,
            'width=' + width + ',height=' + height + ',top=' + top + ',left=' + left + ',scrollbars=yes,resizable=yes'
        );
    }

    // --- FUNCIÓN ENVIAR WHATSAPP ---
    async function enviarWhatsappVenta(nombre, serie, numero, total, telefono) {
        // Nombre de la empresa (configurable via Thymeleaf)
        const nombreEmpresa = /*[[${@configuracionService.obtenerConfiguracion().getNombreEmpresa() ?: 'Librería H & J'}]]*/ 'Librería H & J';

        // Construir mensaje formateado
        let mensaje = `*${nombreEmpresa}*\n`;
        mensaje += `━━━━━━━━━━━━━━━━━━\n`;
        mensaje += `📄 *Comprobante N°:* ${serie}-${numero}\n`;
        mensaje += `━━━━━━━━━━━━━━━━━━\n\n`;
        mensaje += `👤 *Cliente:* ${nombre}\n\n`;
        mensaje += `━━━━━━━━━━━━━━━━━━\n`;
        mensaje += `💰 *TOTAL: S/ ${parseFloat(total).toFixed(2)}*\n`;
        mensaje += `━━━━━━━━━━━━━━━━━━\n\n`;
        mensaje += `¡Gracias por su compra! 🙏\n`;
        mensaje += `Lo esperamos pronto.`;

        // SweetAlert inteligente: Si ya hay teléfono lo sugiere, si no, pide ingresarlo
        const { value: nuevoNumero } = await Swal.fire({
            title: '<i class="fab fa-whatsapp text-success"></i> Enviar Comprobante',
            html: `
                <p class="mb-3">Enviar comprobante <strong>${serie}-${numero}</strong> por WhatsApp</p>
                <div class="form-group text-left">
                    <label class="font-weight-bold">Número de WhatsApp:</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-success text-white">+51</span>
                        </div>
                        <input type="tel" id="swal-input-telefono" class="form-control form-control-lg"
                               value="${telefono || ''}" placeholder="999888777" maxlength="9">
                    </div>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: '<i class="fab fa-whatsapp"></i> Enviar',
            confirmButtonColor: '#25D366',
            cancelButtonText: 'Cancelar',
            focusConfirm: false,
            preConfirm: () => {
                const valor = document.getElementById('swal-input-telefono').value.trim();
                if (!valor || valor.length < 9) {
                    Swal.showValidationMessage('Ingrese un número válido de 9 dígitos');
                    return false;
                }
                return valor.replace(/\D/g, '');
            }
        });

        if (nuevoNumero) {
            // Abre WhatsApp Web/App con el mensaje preformateado
            window.open(`https://wa.me/51${nuevoNumero}?text=${encodeURIComponent(mensaje)}`, '_blank');

            // Toast de confirmación
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: 'Abriendo WhatsApp...',
                showConfirmButton: false,
                timer: 2000
            });
        }
    }
</script>
</th:block>
</body>
</html>
