<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="hold-transition login-page bg-dark">
<div class="login-box" style="width: 400px;">
    <div class="card card-outline card-danger">
        <div class="card-header text-center">
            <h1><i class="fas fa-file-invoice-dollar"></i> Cierre de Caja</h1>
        </div>
        <div class="card-body">
            <h5 class="text-center mb-4">Resumen del Turno</h5>

            <!-- ALERTA DE CRÉDITOS PENDIENTES (oculto por defecto) -->
            <div id="alertaCreditosPendientes" class="alert alert-warning d-none" role="alert">
                <i class="fas fa-exclamation-triangle"></i>
                <strong>Atención:</strong> Tienes <span id="cantidadCreditos">0</span> venta(s) al crédito
                sin cobrar hoy por un total de <strong>S/ <span id="montoCreditos">0.00</span></strong>
            </div>

            <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Saldo Inicial
                    <span class="badge badge-info badge-pill" th:text="'S/ ' + ${balance.inicial}"></span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Total Ventas/Ingresos
                    <span class="badge badge-success badge-pill" th:text="'+ S/ ' + ${balance.ingresos}"></span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Total Gastos/Egresos
                    <span class="badge badge-danger badge-pill" th:text="'- S/ ' + ${balance.egresos}"></span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center list-group-item-dark">
                    <strong>SE DEBE TENER:</strong>
                    <strong style="font-size: 1.2em;" th:text="'S/ ' + ${balance.saldo}"></strong>
                </li>
            </ul>

            <form id="formCierreCaja" action="/caja/cerrar" method="post">
                <div class="form-group">
                    <label class="text-danger">Dinero Real en Caja (Físico):</label>
                    <input type="number" step="0.10" name="montoReal" id="montoReal"
                           class="form-control form-control-lg text-center font-weight-bold"
                           placeholder="¿Cuánto hay realmente?" required>
                    <small class="form-text text-muted">Cuente los billetes y monedas.</small>
                </div>
                <button type="submit" class="btn btn-danger btn-block btn-lg">
                    <i class="fas fa-lock"></i> CERRAR TURNO
                </button>
            </form>

            <div class="mt-3 text-center">
                <a href="/caja" class="text-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</div>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {
    // Variables para almacenar datos de créditos pendientes
    let creditosPendientes = { cantidad: 0, montoTotal: 0 };

    // 1. Al cargar la página, verificar créditos pendientes
    $.ajax({
        url: '/caja/api/creditos-pendientes-hoy',
        type: 'GET',
        success: function(data) {
            if (data.success && data.cantidad > 0) {
                creditosPendientes = data;
                // Mostrar alerta visual
                $('#cantidadCreditos').text(data.cantidad);
                $('#montoCreditos').text(parseFloat(data.montoTotal).toFixed(2));
                $('#alertaCreditosPendientes').removeClass('d-none');
            }
        },
        error: function(err) {
            console.warn('No se pudo verificar créditos pendientes:', err);
        }
    });

    // 2. Interceptar el submit del formulario
    $('#formCierreCaja').on('submit', function(e) {
        e.preventDefault(); // Prevenir submit inmediato

        let montoReal = $('#montoReal').val();
        if (!montoReal || parseFloat(montoReal) < 0) {
            Swal.fire({
                icon: 'error',
                title: 'Monto inválido',
                text: 'Por favor ingrese el monto real en caja.'
            });
            return false;
        }

        // 3. Si hay créditos pendientes, mostrar advertencia
        if (creditosPendientes.cantidad > 0) {
            Swal.fire({
                icon: 'warning',
                title: 'Créditos Pendientes',
                html: `<p>Tienes <strong>${creditosPendientes.cantidad}</strong> venta(s) al crédito sin cobrar hoy.</p>
                       <p>Monto pendiente: <strong>S/ ${parseFloat(creditosPendientes.montoTotal).toFixed(2)}</strong></p>
                       <p class="text-muted">Estos créditos quedarán pendientes para cobro posterior.</p>
                       <hr>
                       <p><strong>¿Seguro que deseas cerrar el turno?</strong></p>`,
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, cerrar turno',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Usuario confirmó, enviar formulario
                    document.getElementById('formCierreCaja').submit();
                }
            });
        } else {
            // Sin créditos pendientes, confirmar normal
            Swal.fire({
                icon: 'question',
                title: '¿Cerrar turno?',
                text: 'Se registrará el cierre de caja con el monto indicado.',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, cerrar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    document.getElementById('formCierreCaja').submit();
                }
            });
        }

        return false;
    });
});
</script>
</body>
</html>
